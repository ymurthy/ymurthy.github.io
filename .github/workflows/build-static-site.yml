name: Rebuild static website

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "build/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/build-static-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-static-site
  cancel-in-progress: true

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Update published files
        shell: bash
        run: |
          set -euo pipefail
          find dist/client -type f \
            ! -path 'dist/client/.vite/*' \
            ! -name '.assetsignore' \
            ! -name '_headers' \
            -printf '%P\n' | sort > .site-output-manifest

          while IFS= read -r generated_file; do
            mkdir -p -- "$(dirname -- "$generated_file")"
            cp -- "dist/client/$generated_file" "$generated_file"
          done < .site-output-manifest

          touch .nojekyll

      - name: Commit generated website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r generated_file; do
            git add -- "$generated_file"
          done < .site-output-manifest
          git add -- .site-output-manifest .nojekyll

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Rebuild published website"
          git push
